spring.application.name=geoajuda-api

# DataSource
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/geoajuda}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:geoajuda}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:geoajuda123}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# CORS permitido para o frontend
geoajuda.cors.allowed-origins=http://localhost:5173,http://localhost:80

# Actuator
management.endpoints.web.exposure.include=health,info

# SpringDoc OpenAPI / Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

# Open-Meteo API (dados de chuva)
openmeteo.api.base-url=https://api.open-meteo.com/v1
openmeteo.api.timeout-connect-ms=5000
openmeteo.api.timeout-read-ms=10000
openmeteo.cache.ttl-minutes=30
openmeteo.fallback.enabled=true

# Upload de arquivos
upload.dir=./uploads
upload.max-size-mb=5
upload.allowed-types=image/jpeg,image/png,image/webp
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
