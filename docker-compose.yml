version: '3.9'

services:

  postgres:
    image: postgis/postgis:15-3.3
    container_name: geoajuda_db
    environment:
      POSTGRES_DB: geoajuda
      POSTGRES_USER: geoajuda
      POSTGRES_PASSWORD: geoajuda123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/src/main/resources/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geoajuda"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: geoajuda_api
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/geoajuda
      SPRING_DATASOURCE_USERNAME: geoajuda
      SPRING_DATASOURCE_PASSWORD: geoajuda123
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: geoajuda_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
  uploads:
